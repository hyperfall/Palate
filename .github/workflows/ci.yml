name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # These two gates need no database or browser, so they stay fast and green.
      # Payload/Postgres integration (tests/int) and Playwright e2e are excluded
      # here — add them behind a Postgres service job when you want that coverage.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit
